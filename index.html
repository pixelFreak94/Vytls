<!doctype html>
<html lang="en" data-room="today" data-ambient="on" data-sound="off" data-entered="false" data-standalone="false">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#F2EBE0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vytls" />
  <title>Vytls — today</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/sora-vf-latin.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/manrope-vf-latin.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/jetbrains-mono-vf-latin.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/bebas-neue-latin-400.woff2" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- L1 world: room colour, hour tint, blobs, corner web. Filled by atmosphere.js. -->
  <div id="world" class="world" aria-hidden="true"></div>

  <!-- L2 instruments -->
  <div id="readout" class="readout chrome instrument" aria-live="off">
    <span id="readout-glyph" class="readout-glyph" aria-hidden="true"></span>
    <span id="readout-text" class="readout-text"></span>
  </div>
  <div id="live-chip" class="live-chip chrome instrument" aria-hidden="true">
    <span class="live-dot"></span><span class="live-text"></span>
  </div>

  <!-- L3 rooms, in their fixed order (manual §28.3) -->
  <main id="rooms" class="rooms">
    <section id="room-today" class="room" data-room="today" aria-labelledby="h-today">
      <div class="scroller fade-both">
        <h1 id="h-today" class="visually-hidden">today</h1>
        <div class="room-body" data-body="today"></div>
      </div>
    </section>
    <section id="room-history" class="room" data-room="history" aria-labelledby="h-history" hidden>
      <div class="scroller fade-both">
        <h1 id="h-history" class="room-title reveal-item">history</h1>
        <div class="room-body" data-body="history"></div>
      </div>
    </section>
    <section id="room-report" class="room" data-room="report" aria-labelledby="h-report" hidden>
      <div class="scroller fade-both">
        <h1 id="h-report" class="room-title reveal-item">report</h1>
        <div class="room-body" data-body="report"></div>
      </div>
    </section>
    <section id="room-settings" class="room" data-room="settings" aria-labelledby="h-settings" hidden>
      <div class="scroller fade-both">
        <h1 id="h-settings" class="room-title reveal-item">settings</h1>
        <div class="room-body" data-body="settings"></div>
      </div>
    </section>
  </main>

  <!-- L4 navigation (manual §16.2) -->
  <nav id="nav" class="nav chrome" aria-label="rooms" hidden>
    <button class="nav-home" type="button" data-go="today" aria-label="today">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="currentColor">
        <rect x="2" y="2" width="5" height="5" rx="1.4" /><rect x="9" y="2" width="5" height="5" rx="1.4" />
        <rect x="2" y="9" width="5" height="5" rx="1.4" /><rect x="9" y="9" width="5" height="5" rx="1.4" />
      </svg>
    </button>
    <span class="nav-divider" aria-hidden="true"></span>
    <button class="nav-pill" type="button" data-go="history" aria-label="history">his</button>
    <button class="nav-pill" type="button" data-go="report" aria-label="report">rep</button>
    <button class="nav-pill" type="button" data-go="settings" aria-label="settings">set</button>
  </nav>


  <!-- Arrival: the ball as the loader (manual §28.4). Filled by entry.js. -->
  <div id="entry" class="entry chrome" aria-hidden="true"></div>
</body>
</html>
